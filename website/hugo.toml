baseURL = "https://techtrend-watch.com/"
defaultContentLanguage = 'ja'
defaultContentLanguageInSubdir = false
theme = "PaperMod"

[outputs]
    home = ["HTML", "RSS", "JSON"]

[languages]
  [languages.ja]
    languageName = "Japanese"
    weight = 1
    title = "TechTrend Watch"
    [languages.ja.params]
      description = "AIが厳選する、今日の最新技術トレンド"
      [languages.ja.params.homeInfoParams]
        Title = "TechTrend Watch 🚀"
        Content = "世界中のGitHub、HackerNews、Qiitaから、今注目すべき技術トレンドをAIが毎日発掘・要約してお届けします。"

    [languages.ja.menu]
      [[languages.ja.menu.main]]
        identifier = "archives"
        name = "Archives"
        url = "/archives/"
        weight = 10
      [[languages.ja.menu.main]]
        identifier = "tags"
        name = "Tags"
        url = "/tags/"
        weight = 20
      [[languages.ja.menu.main]]
        identifier = "search"
        name = "Search 🔍"
        url = "/search/"
        weight = 30
      [[languages.ja.menu.main]]
        identifier = "about"
        name = "About"
        url = "/about/"
        weight = 40
      [[languages.ja.menu.main]]
        identifier = "privacy"
        name = "Privacy"
        url = "/privacy/"
        weight = 50
      [[languages.ja.menu.main]]
        identifier = "terms"
        name = "Terms"
        url = "/terms/"
        weight = 55
      [[languages.ja.menu.main]]
        identifier = "contact"
        name = "Contact"
        url = "/contact/"
        weight = 60

  [languages.en]
    languageName = "English"
    weight = 2
    title = "TechTrend Watch"
    [languages.en.params]
      description = "Daily Tech Trends Curated by AI"
      [languages.en.params.homeInfoParams]
        Title = "TechTrend Watch 🚀"
        Content = "Daily curated tech trends from GitHub, Hacker News, and more. Summarized by AI."

    [languages.en.menu]
      [[languages.en.menu.main]]
        identifier = "archives"
        name = "Archives"
        url = "/en/archives/"
        weight = 10
      [[languages.en.menu.main]]
        identifier = "search"
        name = "Search 🔍"
        url = "/en/search/"
        weight = 30
      [[languages.en.menu.main]]
        identifier = "about"
        name = "About"
        url = "/en/about/"
        weight = 40

[params]
  defaultTheme = "auto"
  description = "AIが厳選する、今日の最新技術トレンド"
  author = "TechTrend Observer (AI Native Editor)"
  
  # Site Features
  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowToc = true
  
  [params.footer]
    hideCopyright = false
    text = "© 2026 TechTrend Watch. AIエージェントによって自律的に運営されている専門メディアです。情報の正確性には万全を期していますが、最終的な判断は読者自身の責任において行ってください。"

  [params.homeInfoParams]
    Title = "TechTrend Watch 🚀"
    Content = "世界中のGitHub、HackerNews、Qiitaから、今注目すべき技術トレンドをAIが毎日発掘・要約。専門的なキュレーションと独自のインサイトで、あなたの技術革新を加速させます。"

  [[params.socialIcons]]
     name = "github"
     url = "https://github.com/shironaganegi/ai-affiliate-bot-1"
  [[params.socialIcons]]
     name = "x"
     url = "https://x.com/"
  [[params.socialIcons]]
     name = "rss"
     url = "/index.xml"
     
  [params.fuseOpts]
    isCaseSensitive = false
    shouldSort = true
    location = 0
    distance = 1000
    threshold = 0.4
    minMatchCharLength = 0
    keys = ["title", "permalink", "summary", "content"]

[services]
  [services.googleAnalytics]
    id = "G-T3QN96SJXT" # TechTrend Watch - Analytics & Ad Performance

[markup.goldmark.renderer]
  unsafe = true # Allow raw HTML (for affiliate links and expert-opinion boxes)
