[params]
  defaultTheme = "auto"
  description = "厳選してお届けする、今日の最新技術トレンド"
  author = "しろねぎ"

  # 著者ボックス／E-E-A-T 用（日本語。英語は [languages.en.params] で上書き）
  authorName = "しろねぎ"
  authorProfileUrl = "/authors/shironaganegi/"
  authorBio = "TechTrend Watch の運営・編集担当。機械学習／LLM・開発ツールを追う個人開発者。一次情報をもとに、実装の勘所や比較を加えて記事を再構成しています。"

  # Site Features
  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowToc = true
  
  [params.footer]
    hideCopyright = false
    text = "© 2026 TechTrend Watch（運営・編集：しろねぎ）. 技術トレンドを開発者視点で厳選・解説するテックメディアです。情報の正確性には万全を期していますが、最終的な判断は読者自身の責任において行ってください。"

  [params.homeInfoParams]
    Title = "TechTrend Watch 🚀"
    Content = "世界中のGitHub、HackerNews、Qiitaから、今注目すべき技術トレンドを厳選。専門的なキュレーションと独自のインサイトで、あなたの技術革新を加速させます。"

  [[params.socialIcons]]
     name = "x"
     url = "https://x.com/sai3desuyo"
  [[params.socialIcons]]
     name = "rss"
     url = "/index.xml"
     
  [params.fuseOpts]
    isCaseSensitive = false
    shouldSort = true
    location = 0
    distance = 1000
    threshold = 0.4
    minMatchCharLength = 0
    keys = ["title", "permalink", "summary", "content"]

[services]
  [services.googleAnalytics]
    id = "G-T3QN96SJXT" # TechTrend Watch - Analytics & Ad Performance

[markup.goldmark.renderer]
  unsafe = true # Allow raw HTML (expert-opinion boxes など)

# 関連記事（内部リンク強化・回遊率向上のため）
[related]
  includeNewer = true
  threshold = 80
  toLower = true
  [[related.indices]]
    name = "tags"
    weight = 100
  [[related.indices]]
    name = "title"
    weight = 30
  [[related.indices]]
    name = "date"
    weight = 10
